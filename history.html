<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex">
<title>Earth Time Machine</title>
<script>
(function(){
  var h=new URLSearchParams(location.hash.slice(1)), o=new URLSearchParams();
  o.set('lens','history');
  ['p','c','d','d2'].forEach(function(k){ if(h.get(k)) o.set(k,h.get(k)); });
  var s=h.get('src'), map={s2:'s2',s2s:'s2',ls:'landsat',landsat:'landsat',wb:'aerial',esri:'aerial',aerial:'aerial'};
  if(map[s]) o.set('src',map[s]); else if('') o.set('src','daily');
  location.replace('app.html#'+o.toString().replace(/%2C/g,','));
})();
</script>
<meta http-equiv="refresh" content="1;url=app.html#lens=history">
</head><body style="background:#0f2a3d;color:#eaf2f5;font-family:system-ui;padding:24px">
<p>This page has moved. <a style="color:#4fb3bf" href="app.html#lens=history">Open Earth Time Machine</a>.</p>
</body></html>
